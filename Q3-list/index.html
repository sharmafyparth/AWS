<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Types of list</title>
</head>
<body>
    <table>
        <tr>
            <td>
                <h2>Unordered List</h2>
                <ul>
                    <li>Item 1</li>
                    <li>Item 2</li>
                    <li>Item 3</li>
                </ul>
            </td>
        </tr>
        <tr>
            <td>
                <h2>Ordered List</h2>
                <ol>
                    <li>First Item</li>
                    <li>Second Item</li>
                    <li>Third Item</li>
                </ol>
            </td>
        </tr>
        <tr>
            <td>
                <h2>Description List</h2>
                <dl>
                    <dt>Term 1</dt>
                    <dd>Description for Term 1</dd>
                    <dt>Term 2</dt>
                    <dd>Description for Term 2</dd>
                </dl>
            </td>
        </tr>
    </table>
</body>
</html>
